x-app: &app
  build:
    context: .
    dockerfile: deployment/docker/Dockerfile
  environment: &app-env
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:?set in .env}
    RABBITMQ_URL: amqp://${RABBITMQ_USER:?set in .env}:${RABBITMQ_PASSWORD:?set in .env}@rabbitmq:5672/

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set in .env}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    <<: *app
    restart: unless-stopped
    environment:
      <<: *app-env
      API_KEY: ${API_KEY:?set in .env}
    command: >-
      sh -c "alembic upgrade head
      && uvicorn payments_processing.presentation.api.app:build_app --factory --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  consumer:
    <<: *app
    restart: unless-stopped
    environment:
      <<: *app-env
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set in .env}
      WEBHOOK_ALLOWED_HOSTS: webhook-echo
    command: faststream run payments_processing.presentation.consumer.app:build_consumer --factory
    depends_on:
      api:
        condition: service_healthy

  webhook-echo:
    build: ./tools/webhook_echo
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set in .env}
    ports:
      - "9000:9000"
